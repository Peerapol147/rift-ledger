<style>

.opts button.o-lock{opacity:.55;cursor:not-allowed;border-left-style:dashed}.opts button.o-lock:hover{background:transparent}.opts{display:grid;gap:6px;margin-top:10px}.opts small i{font-style:normal;display:block}.opts small b{font-weight:400}.opts small .g{color:var(--good)}.opts small .b{color:var(--bad)}.opts button{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 12px}.opts em{font-style:normal;font-size:12px;font-weight:700;white-space:nowrap;padding:2px 7px;border:1px solid}.opts .g{color:var(--good)}.opts .m{color:var(--amb)}.opts .b{color:var(--bad)}
#tabs{display:flex;gap:3px;overflow-x:auto}#tabs button{flex:1;text-align:center;white-space:nowrap}

.item{display:block;background:var(--pan2);border:1px solid var(--line);padding:7px 10px;margin-bottom:5px}.item.sel{width:100%}.item.on{background:#2a2040;color:var(--ink);border-color:var(--rift)}.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:5px}.grid2 .item{margin:0}.shop{display:block}.needs{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--dim);margin-top:3px}.needs .ok{color:var(--good)}.gear.q2 b{color:var(--good)}.gear.q3 b{color:#7fb8ff}.gear.q4 b{color:var(--leg)}
.skc,.item.on.skc{border-left:3px solid var(--r);text-align:left}.skc b{margin-right:7px}.skc small{display:block}.skc .eff{color:var(--ink)}.skc .flv{font-style:italic}.rar{font-style:normal;font-size:11px;font-weight:700;color:var(--r);border:1px solid var(--r);padding:0 6px;white-space:nowrap}.skc.top{box-shadow:inset 0 0 18px color-mix(in srgb,var(--r) 22%,transparent)}.skc.top .rar{background:var(--r);color:#14100a}.rars{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px;margin:6px 0}.rars span{color:var(--r)}.rars span:not(:last-child)::after{content:" ›";color:var(--dim);margin-left:12px}
.tower{display:grid;grid-template-columns:repeat(20,1fr);gap:2px}.tower i{aspect-ratio:1;background:#2a3548;display:block}.tower .f-boss{background:#a03838}.tower .f-elite{background:#a8782a}.tower .f-rest{background:#2c7a54}.tower .f-cache{background:#3a66a8}.tower .done{opacity:.28}.tower .cur{outline:2px solid #fff}.rank{padding-left:20px;margin:0}.rank li{padding:1px 0}.rank li span{margin-right:8px}.rank b{float:right;font-weight:400;color:var(--dim)}
#start,#end{position:fixed;inset:0;display:grid;place-items:center;padding:16px;overflow:auto;background:radial-gradient(ellipse at 50% 0,#2b1245 0,#0a0d13 62%);z-index:5}#end{background:#0a0d13ee}.st-card{width:min(560px,100%);background:var(--pan);border:1px solid var(--line);border-top:3px solid var(--rift);padding:26px}.st-card h1{font-size:36px;line-height:1.2;margin:4px 0 8px}.lede{color:var(--dim)}.title{color:var(--leg);font-size:20px;font-weight:600}.st-card label{display:block;margin-top:14px;font-size:13px;color:var(--dim)}.st-card .row{margin-top:18px}.st-card label .row{margin-top:4px}.st-card .row button{flex:1;text-align:center}.st-card label .row button{flex:none}.sum{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-top:14px}.hall{list-style:none;padding:0;margin:0;font-size:13px}.hall li{padding:3px 0;border-bottom:1px solid var(--line)}

button{transition:border-color .12s,background-color .12s,transform .08s}button:active:not(:disabled){transform:translateY(1px)}

.opts button{border-left:3px solid var(--line);align-items:flex-start}.opts button>span{flex:1;min-width:0}.opts button:hover{background:#222c3e}.opts button.o-g{border-left-color:var(--good)}.opts button.o-m{border-left-color:var(--amb)}.opts button.o-b{border-left-color:var(--bad)}.opts kbd{margin-top:2px}.opts em{align-self:center}
.res{position:relative;border-top-color:var(--dim)}.res.ok{border-top-color:var(--good)}.res.fail{border-top-color:var(--bad)}.res .l{font-size:13px;margin-top:6px}.res .l span{font-size:11px;color:var(--dim);border:1px solid var(--line);padding:0 5px;margin-right:6px}
.rstamp{position:absolute;top:9px;right:12px;font-weight:700;font-size:15px;letter-spacing:.06em;padding:1px 10px;border:2px solid;border-radius:4px;transform:rotate(-6deg);animation:stamp .34s cubic-bezier(.2,1.5,.4,1) both}.ok .rstamp{color:var(--good)}.fail .rstamp{color:var(--bad)}
@keyframes stamp{from{opacity:0;transform:rotate(-16deg) scale(2.3)}to{opacity:1;transform:rotate(-6deg) scale(1)}}
.ev p.pickl{color:var(--dim);font-size:13px;padding-right:86px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.chips i{font-style:normal;font-size:12px;font-weight:600;padding:0 8px;border:1px solid;border-radius:10px;animation:chip .3s ease-out both}.chips i:nth-child(2){animation-delay:.06s}.chips i:nth-child(3){animation-delay:.12s}.chips i:nth-child(4){animation-delay:.18s}.chips i:nth-child(n+5){animation-delay:.24s}.chips .up{color:var(--good)}.chips .dn{color:var(--bad)}

.st-card{animation:evin .4s ease-out both}.fin .title{display:inline-block;margin:6px 0;padding:2px 14px;border:2px solid var(--leg);border-radius:4px;transform:rotate(-2deg);animation:stamp .5s .25s cubic-bezier(.2,1.5,.4,1) both}

<script>
(function(){
  var a=new Audio("audio/shadows-resolve.mp3");a.loop=true;a.volume=0.4;
  var on=true;try{on=localStorage.getItem("bgm")!=="off"}catch(e){}
  var b=document.createElement("button");
  b.style.cssText="position:fixed;right:12px;bottom:12px;z-index:9999;padding:8px 12px;border-radius:20px;border:1px solid #888;background:#000a;color:#fff;cursor:pointer";
  function ui(){b.textContent=on&&!a.paused?"🔊 เพลง":"🔇 เพลง"}
  function play(){if(on)a.play().then(ui).catch(function(){})}
  b.onclick=function(e){e.stopPropagation();on=!on;try{localStorage.setItem("bgm",on?"on":"off")}catch(x){}
    if(on)play();else a.pause();ui()};
  document.body.appendChild(b);ui();
  ["pointerdown","click","keydown","touchstart"].forEach(function(t){
    document.addEventListener(t,function f(){play();document.removeEventListener(t,f)})});
  play();
})();
</script>
</body>
