<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>บันทึกหลังรอยแยก</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d13;--pan:#121823;--pan2:#1a2230;--line:#2a3548;--ink:#e3e9f2;--dim:#8d9bb0;--rift:#c86bff;--amb:#ffb648;--good:#62e0a1;--bad:#ff6f6f;--leg:#ffd76a}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--ink);font:15px/1.55 "Chakra Petch",Tahoma,sans-serif}
[hidden]{display:none!important}h1,h2,h3,h4,p{margin:0}h3{font-size:14px;margin:18px 0 8px;color:var(--amb);letter-spacing:.02em}h4{font-size:12px;color:var(--dim);margin:12px 0 4px;border-bottom:1px solid var(--line);padding-bottom:2px}small{display:block;color:var(--dim);font-size:12px;font-weight:400}
button,input{font:inherit;color:inherit}button{background:var(--pan2);border:1px solid var(--line);padding:6px 11px;cursor:pointer;border-radius:3px;text-align:left;min-height:34px}button:hover{border-color:var(--rift)}button:focus-visible,input:focus-visible{outline:2px solid var(--amb);outline-offset:1px}button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}button.pri{background:var(--rift);color:#12061d;font-weight:700;border-color:var(--rift)}button.ghost{background:none}button.amber{border-color:var(--amb);color:var(--amb)}button.sm{font-size:13px;padding:3px 8px;min-height:28px}button:disabled{opacity:.35;cursor:not-allowed}button small{color:inherit;opacity:.72}
input{background:#0c1018;border:1px solid var(--line);padding:8px 10px;width:100%;border-radius:3px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}.row.wrap{flex-wrap:wrap}.row.end{justify-content:flex-end;margin:0}.dim{color:var(--dim);font-size:13px}.bad{color:var(--bad)}
#game{max-width:1600px;margin:0 auto;padding:12px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px}
#card{background:var(--pan);border:1px solid var(--line);padding:14px;align-self:start;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.lic{position:relative;border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:10px}.kicker{font-size:11px;letter-spacing:.14em;color:var(--dim)}.lic h2{font-size:22px;line-height:1.2;margin-top:2px;padding-right:58px}.role{font-weight:600;font-size:14px}.meta{font-size:12px;color:var(--dim)}
.stamp{position:absolute;top:0;right:0;width:52px;height:52px;display:grid;place-items:center;font-weight:700;font-size:25px;border:2px solid var(--dim);color:var(--dim);transform:rotate(7deg);border-radius:4px}.stamp:not(.r0):not(.r1):not(.r2):not(.r3):not(.r4):not(.r5):not(.r6){font-size:13px}.r0,.r1{color:#b9c6d6;border-color:#b9c6d6}.r2,.r3{color:var(--good);border-color:var(--good)}.r4{color:var(--amb);border-color:var(--amb)}.r5,.r6{color:var(--rift);border-color:var(--rift);box-shadow:0 0 14px #c86bff77}
.kv{display:flex;justify-content:space-between;font-size:13px;gap:8px;margin-top:5px}.kv span{color:var(--dim)}.kv.small{margin-top:10px}.bar{height:7px;background:#0b0f16;border:1px solid var(--line);margin-top:2px}.bar i{display:block;height:100%;background:var(--ink);transition:width .2s}.bar.hp i{background:var(--bad)}.bar.xp i{background:var(--rift)}.bar.age i{background:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:12px}.stat{display:flex;justify-content:space-between;align-items:baseline;padding:4px 7px;font-size:15px}.stat small{font-size:12px}.stat.on{color:var(--bg)}.stat.on small{color:var(--bg)}
.tip{background:#0c1018;border:1px solid var(--amb);padding:7px 9px;margin-top:6px;font-size:13px}.vit{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--dim);margin-top:10px}.vit b{color:var(--ink)}
.focus{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:5px;margin-top:10px}.focus button{text-align:center}.focus button small{display:block;font-size:11px;opacity:.75}.focus button.risk,button.risk{border-color:#c2554a;color:#e48a7f}.fgrp{margin-top:9px}.fgrp .focus{margin-top:4px}.gl{font-size:12px;font-weight:700;color:var(--amb)}.gl small{font-weight:400;color:var(--dim);margin-left:4px}.desk .tag+.dim{margin-top:6px}#card .desk{margin:14px -14px -14px;border-left:0;border-right:0;border-bottom:0;min-height:0}#card .desk .focus{grid-template-columns:repeat(2,1fr)}.l .dl{display:block;font-weight:600;font-size:12px;color:var(--good);margin-top:1px}.l.bad .dl{color:var(--bad)}
#center{display:flex;flex-direction:column;gap:10px;height:calc(100vh - 24px)}#top{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(280px,1fr);gap:10px}#event{min-width:0;max-height:54vh;overflow:auto}#lower{flex:1;min-height:190px;display:flex;flex-direction:column}
#stagewrap{position:relative;background:#000;border:1px solid var(--line);overflow:hidden;aspect-ratio:256/144}#cv{width:100%;height:100%;display:block;image-rendering:pixelated}#ov{position:absolute;inset:0;pointer-events:none}
.float{position:absolute;transform:translateX(-50%);font-weight:700;font-size:20px;text-shadow:0 2px 0 #000,0 0 6px #000;animation:up .95s ease-out forwards}.float.crit{color:var(--leg);font-size:28px}.float.bad{color:var(--bad)}.float.good{color:var(--good)}.float.sk{font-size:15px;color:#fff;top:12%!important}@keyframes up{from{opacity:0;margin-top:14px}15%{opacity:1;margin-top:0}to{opacity:0;margin-top:-52px}}
#ctrl{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}#ctrl button{min-width:44px;text-align:center}#ctrl button:last-child{margin-left:auto}
.ev{background:var(--pan);border:1px solid var(--line);border-top:2px solid var(--amb);padding:12px 14px;min-height:100%}.ev.big{border-color:var(--rift);box-shadow:inset 0 0 26px #c86bff22}.ev p{font-size:15px;margin-top:7px}.desk{border-top-color:var(--line)}.desk .tag{background:var(--pan2);color:var(--dim)}.tag{font-size:11px;background:var(--amb);color:#201400;padding:1px 7px;font-weight:700}.ev.big .tag{background:var(--rift);color:#12061d}
.opts{display:grid;gap:6px;margin-top:10px}.opts small i{font-style:normal;display:block}.opts small b{font-weight:400}.opts small .g{color:var(--good)}.opts small .b{color:var(--bad)}.opts button{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 12px}.opts em{font-style:normal;font-size:12px;font-weight:700;white-space:nowrap;padding:2px 7px;border:1px solid}.opts .g{color:var(--good)}.opts .m{color:var(--amb)}.opts .b{color:var(--bad)}
#tabs{display:flex;gap:3px;overflow-x:auto}#tabs button{flex:1;text-align:center;white-space:nowrap}
#view{background:var(--pan);border:1px solid var(--line);padding:12px 14px;margin-top:3px;flex:1;min-height:0;overflow:auto}#view>h3:first-child{margin-top:0}
#view h4{position:sticky;top:-12px;background:var(--pan);padding-top:6px}.l{font-size:14px;padding:4px 0}.l em{font-style:normal;font-size:11px;color:var(--dim);margin-left:8px;white-space:nowrap}.l span{font-size:11px;color:var(--dim);border:1px solid var(--line);padding:0 5px;margin-right:6px}.l.imp{color:#fff}.l.good{color:var(--good)}.l.bad{color:var(--bad)}.l.leg{color:var(--leg);font-weight:600}.l.sum{color:var(--dim);font-size:13px}
.item{display:block;background:var(--pan2);border:1px solid var(--line);padding:7px 10px;margin-bottom:5px}.item.sel{width:100%}.item.on{background:#2a2040;color:var(--ink);border-color:var(--rift)}.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:5px}.grid2 .item{margin:0}.shop{display:block}.needs{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--dim);margin-top:3px}.needs .ok{color:var(--good)}.gear.q2 b{color:var(--good)}.gear.q3 b{color:#7fb8ff}.gear.q4 b{color:var(--leg)}
.skc,.item.on.skc{border-left:3px solid var(--r);text-align:left}.skc b{margin-right:7px}.skc small{display:block}.skc .eff{color:var(--ink)}.skc .flv{font-style:italic}.rar{font-style:normal;font-size:11px;font-weight:700;color:var(--r);border:1px solid var(--r);padding:0 6px;white-space:nowrap}.skc.top{box-shadow:inset 0 0 18px color-mix(in srgb,var(--r) 22%,transparent)}.skc.top .rar{background:var(--r);color:#14100a}.rars{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px;margin:6px 0}.rars span{color:var(--r)}.rars span:not(:last-child)::after{content:" ›";color:var(--dim);margin-left:12px}
.tower{display:grid;grid-template-columns:repeat(20,1fr);gap:2px}.tower i{aspect-ratio:1;background:#2a3548;display:block}.tower .f-boss{background:#a03838}.tower .f-elite{background:#a8782a}.tower .f-rest{background:#2c7a54}.tower .f-cache{background:#3a66a8}.tower .done{opacity:.28}.tower .cur{outline:2px solid #fff}.rank{padding-left:20px;margin:0}.rank li{padding:1px 0}.rank li span{margin-right:8px}.rank b{float:right;font-weight:400;color:var(--dim)}
#start,#end{position:fixed;inset:0;display:grid;place-items:center;padding:16px;overflow:auto;background:radial-gradient(ellipse at 50% 0,#2b1245 0,#0a0d13 62%);z-index:5}#end{background:#0a0d13ee}.st-card{width:min(560px,100%);background:var(--pan);border:1px solid var(--line);border-top:3px solid var(--rift);padding:26px}.st-card h1{font-size:36px;line-height:1.2;margin:4px 0 8px}.lede{color:var(--dim)}.title{color:var(--leg);font-size:20px;font-weight:600}.st-card label{display:block;margin-top:14px;font-size:13px;color:var(--dim)}.st-card .row{margin-top:18px}.st-card label .row{margin-top:4px}.st-card .row button{flex:1;text-align:center}.st-card label .row button{flex:none}.sum{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-top:14px}.hall{list-style:none;padding:0;margin:0;font-size:13px}.hall li{padding:3px 0;border-bottom:1px solid var(--line)}
@media (max-width:1100px){#center{height:auto;display:block}#top{grid-template-columns:1fr}#event{max-height:none;margin-top:8px}#lower{margin-top:8px}#view{min-height:280px;max-height:60vh}}
@media (max-width:820px){#game{grid-template-columns:1fr;padding:8px}#card{position:static;max-height:none;order:2}#center{order:1}#view{height:auto;min-height:260px;max-height:60vh}}
#ov[data-weather]:not([data-weather=""])::after{content:attr(data-weather);position:absolute;top:8px;right:8px;padding:3px 7px;background:#182536c9;color:#eef2df;font-size:11px;border:1px solid #b8c6c455}
</style>
</head>
<body>
<div id="start"></div><div id="end" hidden></div>
<div id="game" hidden><aside id="card"></aside><section id="center"><div id="top"><div><div id="stagewrap"><canvas id="cv"></canvas><div id="ov"></div></div><div id="ctrl"></div></div><div id="event"></div></div><div id="lower"><nav id="tabs"></nav><div id="view"></div></div></section></div>
<script>/*BUNDLE*/</script>
</body>
</html>
