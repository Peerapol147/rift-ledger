<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>บันทึกหลังรอยแยก</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d13;--pan:#121823;--pan2:#1a2230;--line:#2a3548;--ink:#e3e9f2;--dim:#a3afc2;--rift:#c86bff;--amb:#ffb648;
--good:#62e0a1;--bad:#ff6f6f;--leg:#ffd76a;--r0:#b9c6d6;--r1:#62e0a1;--r2:#7fb8ff;--r3:#ffd76a;--r4:#c86bff;--fs:15px;
--t-life:#7fb8ff;--t-work:#ffb648;--t-gate:#c86bff;--t-world:#ff8a8a;--t-team:#62e0a1}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:var(--fs)/1.55 "Chakra Petch",Tahoma,sans-serif}
[hidden]{display:none!important}h1,h2,h3,h4,p{margin:0}
h3{font-size:.9em;margin:16px 0 6px;color:var(--amb);letter-spacing:.02em}h3:first-child{margin-top:0}
h4{font-size:.8em;color:var(--dim);margin:10px 0 4px;border-bottom:1px solid var(--line);padding-bottom:2px}
.num,.kv b,.stat b,td.n{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{background:var(--pan2);border:1px solid var(--line);padding:6px 11px;cursor:pointer;border-radius:3px;min-height:34px;text-align:left}
button:hover{border-color:var(--rift)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amb);outline-offset:1px}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}button.pri{background:var(--rift);color:#12061d;font-weight:700;border-color:var(--rift)}
button.sm{font-size:.85em;padding:2px 8px;min-height:28px}button:disabled{opacity:.4;cursor:not-allowed}
input,select{background:#0c1018;border:1px solid var(--line);padding:6px 8px;border-radius:3px}
.dim{color:var(--dim);font-size:.88em}.bad{color:var(--bad)}.good{color:var(--good)}.leg{color:var(--leg)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
#game{max-width:1500px;margin:0 auto;padding:12px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px}
#card{background:var(--pan);border:1px solid var(--line);padding:14px;align-self:start;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.who h2{font-size:1.4em;line-height:1.2}.who .role{font-weight:600}.who{border-bottom:1px dashed var(--line);padding-bottom:10px;position:relative}
.stamp{position:absolute;top:0;right:0;min-width:46px;height:46px;display:grid;place-items:center;font-weight:700;font-size:1.4em;border:2px solid var(--dim);color:var(--dim);transform:rotate(6deg);border-radius:4px;padding:0 4px}
.kv{display:flex;justify-content:space-between;font-size:.88em;gap:8px;margin-top:5px}.kv span{color:var(--dim)}
.bar{height:6px;background:#0b0f16;border:1px solid var(--line);margin-top:2px}.bar i{display:block;height:100%;background:var(--ink)}
.bar.hp i{background:var(--bad)}.bar.mind i{background:#7fb8ff}.bar.age i{background:var(--dim)}.bar.xp i{background:var(--rift)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}.stat{display:flex;justify-content:space-between;padding:4px 7px;background:var(--pan2);border:1px solid var(--line)}
.stat span{color:var(--dim);font-size:.85em}
.alert{border-left:3px solid var(--bad);background:#2a141a;padding:5px 8px;margin-top:6px;font-size:.88em}
.goal{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.88em;margin-top:4px}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}.plan button{text-align:center}
#center{display:flex;flex-direction:column;gap:10px;min-width:0}
#top{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:10px}
#stagewrap{position:relative;background:#000;border:1px solid var(--line);overflow:hidden;aspect-ratio:256/144}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated}#ov{position:absolute;inset:0;pointer-events:none}
#ctrl{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;align-items:center}#ctrl button{min-width:44px;text-align:center}#ctrl .sp{flex:1}
#event .ev{background:var(--pan);border:1px solid var(--line);border-top:2px solid var(--amb);padding:12px 14px;min-height:100%}
#event .ev.big{border-top-color:var(--rift)}
#event .ev.t-rare{border-top-color:#a37cf2;box-shadow:inset 0 0 0 1px #6c3fc855}
#event .ev.t-world{border-top-color:var(--bad)}
.evhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tier{font-size:.78em;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.tier.uncommon{color:#62e0a1}.tier.story{color:var(--amb)}.tier.rare{color:#c3a6ff}.tier.world{color:var(--bad)}
.evstats{font-size:.8em;color:var(--dim);margin-top:6px}.evstats b{color:#fff}
.mstat{display:none;gap:10px;flex-wrap:wrap;font-size:.85em;color:var(--dim);margin-bottom:6px}.mstat b{color:var(--ink)}
.waitchip{display:inline-block;margin-top:8px;padding:2px 10px;border:1px solid var(--amb);color:var(--amb);font-size:.85em;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}@media (prefers-reduced-motion:reduce){.waitchip{animation:none}}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
.opt.fate{opacity:.8;font-size:.9em}
.fblink{color:var(--rift);text-decoration:none;font-size:.92em}.fblink:hover{text-decoration:underline}
.howto{margin-top:12px;font-size:.92em}.howto summary{cursor:pointer;color:var(--amb)}.howto p{margin-top:6px;color:var(--dim)}.howto b{color:#fff}
.result{margin-bottom:8px;padding:8px 12px;border-left:3px solid var(--amb);background:var(--pan);animation:pop .22s ease-out}
.result.good{border-left-color:#62e0a1}.result.bad{border-left-color:var(--bad)}
@keyframes pop{0%{transform:scale(.96);opacity:0}70%{transform:scale(1.01);opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.result{animation:none}}
.tag{display:inline-block;font-size:.78em;font-weight:700;padding:1px 7px;color:#14100a;background:var(--amb)}
.tag.t-life{background:var(--t-life)}.tag.t-work{background:var(--t-work)}.tag.t-gate{background:var(--t-gate)}.tag.t-world{background:var(--t-world)}.tag.t-team{background:var(--t-team)}
.ev p{margin-top:8px}.opts{display:grid;gap:6px;margin-top:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:8px 10px}
.opt small{display:block;color:var(--dim);font-size:.82em}.opt kbd{font-size:.75em;color:var(--dim);border:1px solid var(--line);padding:0 5px;margin-right:6px}
.badge{font-size:.75em;font-weight:700;white-space:nowrap;padding:1px 6px;border:1px solid}.badge.g{color:var(--good)}.badge.m{color:var(--amb)}.badge.b{color:var(--bad)}
.lock{opacity:.6;border-style:dashed}.lockrow{display:flex;justify-content:space-between;align-items:center;font-size:.82em;color:var(--dim)}
.prep{background:var(--pan2);border:1px solid var(--line);padding:8px;margin-top:8px;font-size:.88em}
.opbar{margin-top:8px;font-size:.85em}
#tabs{display:flex;gap:3px;overflow-x:auto}#tabs button{flex:1;text-align:center;white-space:nowrap}
#view{background:var(--pan);border:1px solid var(--line);padding:12px 14px;margin-top:3px;min-height:260px;max-height:52vh;overflow:auto}
.l{font-size:.92em;padding:3px 0;display:flex;gap:8px}.l .tag{flex:none;align-self:start;margin-top:3px}.l.imp{color:#fff}.l.leg{color:var(--leg)}.l.bad{color:var(--bad)}.l.good{color:var(--good)}
.yr{font-size:.78em;color:var(--dim);margin-top:10px;border-bottom:1px solid var(--line)}
.ysum{border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:4px 0 8px}
.ysum b{font-size:.85em;color:var(--dim)}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--pan2);border:1px solid var(--line);border-left:3px solid var(--rc,var(--line));padding:6px 9px;margin-bottom:4px}
.item b{color:var(--rc)}.up{color:var(--good)}.dn{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.88em}td{padding:3px 4px;border-bottom:1px solid var(--line)}td.n{text-align:right}
#start,#end{position:fixed;inset:0;display:grid;place-items:center;padding:16px;overflow:auto;background:radial-gradient(ellipse at 50% 0,#2b1245 0,#0a0d13 62%);z-index:5}
#end{background:#0a0d13f0}#start,#end{z-index:12}.st-card{width:min(560px,100%);background:var(--pan);border:1px solid var(--line);border-top:3px solid var(--rift);padding:24px}
.st-card h1{font-size:2em;line-height:1.2;margin:4px 0 8px}.lede{color:var(--dim)}.st-card .row{margin-top:12px}
#modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:20;padding:16px}#modal>div{width:min(520px,100%);max-height:90vh;overflow:auto}
#banner{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:var(--pan2);border:1px solid var(--rift);padding:8px 14px;z-index:7;max-width:calc(100% - 32px)}
.float{position:absolute;transform:translateX(-50%);font-weight:700;font-size:20px;text-shadow:0 2px 0 #000;animation:up .95s ease-out forwards}
.float.crit{color:var(--leg)}.float.bad{color:var(--bad)}.float.good{color:var(--good)}.float.sk{font-size:14px;color:#fff;top:12%!important}
@keyframes up{from{opacity:0;margin-top:14px}15%{opacity:1;margin-top:0}to{opacity:0;margin-top:-52px}}
.foeplate{position:absolute;right:6px;top:6px;background:#000a;padding:3px 8px;font-size:12px;min-width:120px}.foeplate.boss{border:1px solid var(--bad)}
.foeplate .fbar{height:4px;background:#333}.foeplate .fbar i{display:block;height:100%;background:var(--bad)}
@media (max-width:1000px){#top{grid-template-columns:1fr}}
@media (max-width:820px){#game{grid-template-columns:1fr;padding:8px 16px 70px}#card{position:static;max-height:none;order:2}
#center{order:1}.mstat{display:flex!important}#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);padding:6px;z-index:4;border-top:1px solid var(--line)}
#tabs button{min-width:64px;font-size:.8em;padding:4px}#view{max-height:none}}

/* Original ledger UI: clear decisions, generous controls, the existing Rift artwork. */
:root{--pan:#111b2a;--pan2:#1a293b;--line:#314158;--ink:#edf2f8;--dim:#b4c2d3}
body{background:radial-gradient(ellipse at 20% 0,#1d203b 0,transparent 55%),var(--bg)}
button{min-height:44px;border-radius:8px;transition:background .12s,border-color .12s}
button.sm{min-height:40px;padding:6px 10px}button:active:not(:disabled){background:#344561}
button.on:active,button.pri:active{background:#e3c3ff;color:#150c23}
button,input,select,textarea,summary{touch-action:manipulation}
input,select,textarea{min-height:44px;min-width:0;max-width:100%;border-radius:8px}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line)}
#game{gap:18px;padding:20px;grid-template-columns:280px minmax(0,1fr)}
#card,#view,.ev,.prep,.st-card,#stagewrap{border-radius:12px}
#card{top:20px;padding:18px;box-shadow:0 12px 32px #0003}
#center{gap:14px}#top{gap:14px;align-items:start;grid-template-columns:minmax(0,1fr) minmax(300px,1.15fr)}
#dashboard{border:1px solid var(--line);border-radius:12px;background:linear-gradient(110deg,#192338,#131c29);padding:14px 16px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}.brand b{font-size:1.1em}.brand .dim{font-size:.78em}
.brand-mark{display:grid;place-items:center;width:38px;height:38px;background:#c86bff14;border:1px solid #c86bff77;border-radius:10px;color:var(--rift);font-size:26px}
#ctrl{margin:0;gap:6px}#ctrl select{flex:1;min-width:170px}
#clockstate{color:var(--amb);font-size:.83em;margin-top:9px}
#planbox{border:1px solid var(--line);border-radius:10px;background:var(--pan)}
#planbox summary{cursor:pointer;padding:12px 16px;min-height:48px;font-weight:600;color:var(--amb)}
#planbox summary:focus-visible{outline:2px solid var(--amb);outline-offset:2px;border-radius:8px}
#plan{padding:0 16px 14px}.plan{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
#stagewrap{box-shadow:0 12px 30px #0005}#event .ev{padding:16px;box-shadow:0 10px 30px #0002}
.ev p{line-height:1.8}.opts{gap:10px;margin-top:16px}.opt{min-height:52px;padding:12px;align-items:flex-start;flex-wrap:wrap}
.opt>span:first-child{flex:1;min-width:140px}.opt small{margin-top:5px}.badge{border-radius:5px}
#tabs{gap:5px}#tabs button{border-radius:8px 8px 0 0;padding:9px 8px}
#view{padding:18px;min-height:240px;max-height:48vh;scrollbar-gutter:stable}
.item{border-radius:8px;flex-wrap:wrap;padding:10px;gap:10px}.item>span:last-child{display:flex;flex-wrap:wrap;gap:6px}
.item>span:first-child{min-width:0;overflow-wrap:anywhere}.l{padding:8px 0;border-bottom:1px solid #ffffff08}
#banner{z-index:40;border-radius:10px;box-shadow:0 8px 24px #0008;top:max(12px,env(safe-area-inset-top))}
body.dialog-open{overflow:hidden}#modal{overscroll-behavior:contain;padding:12px}
#modal>div{width:min(620px,100%);max-height:calc(100dvh - 24px);border-radius:12px;overscroll-behavior:contain}
#modal .st-card{width:100%;padding:0 18px 18px}.dialog-head{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--pan);padding:14px 0;z-index:1;border-bottom:1px solid var(--line)}
.dialog-head h2{font-size:1.2em}#modal h4{font-size:.9em;margin-top:20px;padding-bottom:8px}
#modal .row input{flex-basis:200px!important}#modal .item>span:last-child{flex-basis:100%}
#game #bgm{position:static!important;margin-left:auto;flex:none;opacity:1!important}
#bgm{top:auto!important;bottom:12px;left:12px!important;min-width:44px;min-height:44px;z-index:15!important}
@media(max-width:1100px){#top{grid-template-columns:1fr}#stagewrap{max-height:240px}#cv{object-fit:contain}}
@media(max-width:820px){
 #game{padding:12px 12px calc(88px + env(safe-area-inset-bottom));grid-template-columns:1fr;gap:14px}
 #card{position:static;max-height:none;padding:16px}#center{gap:10px}#dashboard{padding:12px}
 .brand{margin-bottom:10px}.brand .dim{display:none}#ctrl{gap:5px}#ctrl button{min-width:44px;padding:7px 10px}
 #ctrl select{flex-basis:180px}#clockstate{font-size:.8em}#planbox summary{padding:12px}
 #top{display:flex;flex-direction:column}#top>div{width:100%}#top>div:first-child{order:2}
 #event{order:1}#stagewrap{aspect-ratio:256/110;max-height:190px}#event .ev{padding:14px}
 #view{max-height:55vh;padding:12px}#tabs{padding:7px 8px calc(7px + env(safe-area-inset-bottom));gap:5px;z-index:8}
 #tabs button{min-height:48px;min-width:70px;border-radius:8px;padding:8px;font-size:.85em}
 #bgm{bottom:calc(76px + env(safe-area-inset-bottom));opacity:.9!important}
 .st-card{padding:18px}.st-card h1{font-size:1.65em}.st-card .row input{width:100%;flex-basis:100%!important}
 button.sm{min-height:44px}.opt{gap:8px}.mstat{padding:8px 10px;background:var(--pan);border-radius:8px;border:1px solid var(--line)}
}
@media(prefers-reduced-motion:reduce){button{transition:none}.float{animation:none}.result,.waitchip{animation:none}}

/* Original rank seals and occupational frames; accents encode known rank/job only. */
.profile-art{--profile:#9dbdc9;position:relative;isolation:isolate;height:182px;margin-bottom:16px;border:1px solid var(--profile);border-radius:14px 14px 5px 5px;overflow:hidden;background:radial-gradient(ellipse at 42% 55%,color-mix(in srgb,var(--profile) 20%,transparent),transparent 65%),linear-gradient(155deg,#19273b,#0b111d)}
.profile-art::before{content:"";position:absolute;inset:6px;border:1px solid color-mix(in srgb,var(--profile) 35%,transparent);clip-path:polygon(0 0,30% 0,30% 2%,2% 2%,2% 35%,0 35%,0 100%,100% 100%,100% 65%,98% 65%,98% 2%,70% 2%,70% 0,100% 0,100% 100%,0 100%);pointer-events:none}
.profile-art::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 5px,#ffffff03 5px 6px);pointer-events:none;z-index:-1}
.profile-orbit{position:absolute;width:130px;height:130px;border:1px solid color-mix(in srgb,var(--profile) 25%,transparent);border-radius:50%;left:calc(50% - 65px);top:30px}
.profile-orbit::before,.profile-orbit::after{content:"";position:absolute;inset:10px;border:1px dashed color-mix(in srgb,var(--profile) 22%,transparent);border-radius:50%}
.profile-orbit::after{inset:25px;border-style:solid}
.profile-window{position:absolute;left:calc(50% - 64px);bottom:18px;width:128px;height:128px;overflow:hidden;filter:drop-shadow(0 5px 8px #0009)}
.profile-sprite{display:block;max-width:none;width:400%;height:100%;image-rendering:pixelated;animation:character-frames var(--motion-time,5s) steps(4,end) infinite}
@keyframes character-frames{to{transform:translateX(-100%)}}
.profile-window.infant{width:72px;height:72px;left:calc(50% - 36px);bottom:28px}
.profile-window.toddler{width:96px;height:96px;left:calc(50% - 48px)}
.profile-sigil{position:absolute;left:14px;top:12px;color:var(--profile);width:26px;height:28px}.profile-sigil svg{width:100%;height:100%}
.profile-caption{position:absolute;left:48px;top:16px;font-size:.75em;color:var(--profile);max-width:calc(100% - 115px);line-height:1.3}
.rank-medallion{position:absolute;right:9px;bottom:20px;display:grid;justify-items:center;min-width:58px;min-height:70px;padding:10px 8px 14px;color:var(--profile);background:linear-gradient(135deg,#273447,#080f1d);border:1px solid var(--profile);clip-path:polygon(0 0,100% 0,100% 80%,50% 100%,0 80%)}
.rank-medallion small{font-size:.63em;letter-spacing:.05em}.rank-medallion b{font-size:1.65em;line-height:1.2;text-shadow:0 0 16px color-mix(in srgb,var(--profile) 55%,transparent)}
.profile-rail{position:absolute;bottom:3px;left:14px;right:14px;display:flex;gap:9px;align-items:center;color:var(--profile);font-size:9px}.profile-rail i{height:1px;background:var(--profile);flex:1;opacity:.55}
.grade-crest{border-width:2px;box-shadow:inset 0 0 18px color-mix(in srgb,var(--profile) 12%,transparent)}
.grade-crown{border-width:2px;box-shadow:0 0 18px color-mix(in srgb,var(--profile) 14%,transparent),inset 0 0 24px color-mix(in srgb,var(--profile) 12%,transparent)}
.grade-crown .profile-orbit{border-style:double;border-width:4px;transform:rotate(45deg);border-radius:22px}
.grade-crown .rank-medallion{background:linear-gradient(135deg,color-mix(in srgb,var(--profile) 25%,#172131),#080f1d);min-width:64px}
.grade-young .rank-medallion{min-height:54px;bottom:22px}.grade-young .rank-medallion b{font-size:.9em}
.who{padding-top:1px}.who h2{margin-bottom:5px}.me-portrait{max-width:360px;margin:0 auto 20px}.me-portrait .profile-art{height:210px}.me-portrait .profile-window{height:160px;width:160px;left:calc(50% - 80px)}.me-portrait .profile-window.infant{height:96px;width:96px;left:calc(50% - 48px)}.me-portrait .profile-window.toddler{height:112px;width:112px;left:calc(50% - 56px)}
@media(prefers-reduced-motion:reduce){.profile-art *{animation:none!important}}
</style>
</head>
<body>
<div id="start"></div><div id="end" hidden></div><div id="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title" tabindex="-1" hidden></div><div id="banner" role="status" aria-live="polite" hidden></div>
<div id="game" hidden>
  <aside id="card"></aside>
  <section id="center">
    <header id="dashboard"><div class="brand"><span class="brand-mark" aria-hidden="true">◈</span><div><b>บันทึกหลังรอยแยก</b><div class="dim">ทุกชีวิตทิ้งร่องรอยไว้ในโลก</div></div></div><div id="ctrl"></div><p id="clockstate" role="status"></p></header>
    <details id="planbox"><summary id="planlabel">แผนเดือนนี้</summary><div id="plan"></div></details>
    <div id="top">
      <div><div id="stagewrap"><canvas id="cv"></canvas><div id="ov"></div></div></div>
      <div id="event"></div>
    </div>
    <div id="lower"><nav id="tabs"></nav><div id="view" tabindex="-1"></div></div>
  </section>
</div>

<script>
(function(){
  var a=new Audio("audio/shadows-resolve.mp3");a.id="bgm-audio";a.loop=true;a.volume=0.65;
  var on=true;try{on=localStorage.getItem("bgm")!=="off"}catch(e){}
  var b=document.createElement("button");b.id="bgm";
  b.style.cssText="position:fixed;left:8px;top:8px;padding:8px 12px;border-radius:12px;border:1px solid #64748b;background:#182435;color:#fff;cursor:pointer";
  function ui(){var playing=!a.paused&&!a.error;b.textContent=playing?"🔊 ปิดเพลง":"▶ เปิดเพลง";
    b.setAttribute("aria-label",playing?"ปิดเพลง":"เปิดเพลง");b.setAttribute("aria-pressed",String(playing));}
  function play(){if(!on)return;a.play().then(function(){b.title="Shadow’s Resolve";ui()}).catch(function(err){
    ui();if(!on||!a.paused)return;b.textContent=err.name==="NotAllowedError"?"▶ แตะเปิดเพลง":"↻ ลองเปิดเพลงอีกครั้ง";
    b.title=err.name==="NotAllowedError"?"เบราว์เซอร์รอให้คุณกดเปิดเสียง":"เล่นเพลงไม่สำเร็จ: "+err.message;});}
  b.onclick=function(e){e.stopPropagation();on=a.paused||!!a.error;
    try{localStorage.setItem("bgm",on?"on":"off")}catch(x){}
    if(on){if(a.error)a.load();play()}else a.pause();ui();};
  a.addEventListener("playing",ui);a.addEventListener("pause",ui);
  a.addEventListener("error",function(){ui();b.textContent="↻ โหลดเพลงอีกครั้ง";b.title="โหลดเพลงไม่สำเร็จ แตะเพื่อลองใหม่";});
  document.body.append(a,b);ui();
  ["click","keydown"].forEach(function(t){document.addEventListener(t,function f(e){
    if(e.target.closest?.("#bgm"))return;play();document.removeEventListener(t,f);});});
  play();
})();
</script>
</body>
</html>
