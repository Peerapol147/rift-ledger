[hidden]{display:none!important}h1,h2,h3,h4,p{margin:0}h3{font-size:14px;margin:18px 0 8px;color:var(--amb);letter-spacing:.02em}h4{font-size:12px;color:var(--dim);margin:12px 0 4px;border-bottom:1px solid var(--line);padding-bottom:2px}small{display:block;color:var(--dim);font-size:12px;font-weight:400}

.row{display:flex;gap:8px;align-items:center;margin-top:8px}.row.wrap{flex-wrap:wrap}.row.end{justify-content:flex-end;margin:0}.dim{color:var(--dim);font-size:13px}.bad{color:var(--bad)}

#card{background:var(--pan);border:1px solid var(--line);padding:14px;align-self:start;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.lic{position:relative;border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:10px}.kicker{font-size:11px;letter-spacing:.14em;color:var(--dim)}.lic h2{font-size:22px;line-height:1.2;margin-top:2px;padding-right:58px}.role{font-weight:600;font-size:14px}.meta{font-size:12px;color:var(--dim)}

.item{display:block;background:var(--pan2);border:1px solid var(--line);padding:7px 10px;margin-bottom:5px}.item.sel{width:100%}.item.on{background:#2a2040;color:var(--ink);border-color:var(--rift)}.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:5px}.grid2 .item{margin:0}.shop{display:block}.needs{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--dim);margin-top:3px}.needs .ok{color:var(--good)}.gear.q2 b{color:var(--good)}.gear.q3 b{color:#7fb8ff}.gear.q4 b{color:var(--leg)}
